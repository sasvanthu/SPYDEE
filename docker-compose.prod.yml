# SPYDEE - production deployment.
# Run with:  docker compose --env-file .env.prod -f docker-compose.prod.yml up -d --build

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-spydee}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:-spydee}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-spydee} -d ${POSTGRES_DB:-spydee}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: services/api/Dockerfile
    restart: unless-stopped
    command: >
      sh -c "alembic upgrade head &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers ${UVICORN_WORKERS:-1}"
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-spydee}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-spydee}
      DATABASE_URL_SYNC: postgresql://${POSTGRES_USER:-spydee}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-spydee}
      SECRET_KEY: ${SECRET_KEY:?SECRET_KEY is required}
      UPLOAD_DIR: /data/uploads
      DEMO_MODE: ${DEMO_MODE:-false}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost}
      LLM_PROVIDER: ${LLM_PROVIDER:-}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-llama3.1}
      MAX_UPLOAD_BYTES: ${MAX_UPLOAD_BYTES:-50000000}
    volumes:
      - uploaddata:/data/uploads
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  worker:
    build:
      context: .
      dockerfile: services/worker/Dockerfile
    restart: unless-stopped
    command: python -m app.main
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-spydee}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-spydee}
      DATABASE_URL_SYNC: postgresql://${POSTGRES_USER:-spydee}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-spydee}
      UPLOAD_DIR: /data/uploads
    volumes:
      - uploaddata:/data/uploads
    depends_on:
      db:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile.prod
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-80}:80"
    depends_on:
      - api

volumes:
  pgdata:
  uploaddata: